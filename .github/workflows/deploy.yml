name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Collect site files
        run: |
          if [ -f .output/public/index.html ]; then SRC=.output/public
          elif [ -f dist/client/index.html ]; then SRC=dist/client
          else echo "No built index.html found"; exit 1; fi
          rm -rf pages && cp -r "$SRC" pages
          touch pages/.nojekyll
          echo "=== pages ($SRC) ==="
          find pages -maxdepth 3 -type f -print
          ls pages/assets/*.css pages/assets/*.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
